name: Verify and publish to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: ../docs/evidence/ci/tactics-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactics-${{ matrix.device }}-evidence
          path: docs/evidence/ci/tactics-${{ matrix.device }}/
  immune:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:immune
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: ../docs/evidence/ci/immune-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immune-${{ matrix.device }}-evidence
          path: docs/evidence/ci/immune-${{ matrix.device }}/
  anatomy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:anatomy
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: ../docs/evidence/ci/anatomy-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anatomy-${{ matrix.device }}-evidence
          path: docs/evidence/ci/anatomy-${{ matrix.device }}/
  clarity:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:campaign-ui
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: ../docs/evidence/ci/clarity-${{ matrix.device }}/campaign-ui/
      - run: npm run test:clarity
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: ../docs/evidence/ci/clarity-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clarity-${{ matrix.device }}-evidence
          path: docs/evidence/ci/clarity-${{ matrix.device }}/
  animation:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:animation
        env:
          EVIDENCE_DIR: ../docs/evidence/ci/animation/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animation-evidence
          path: docs/evidence/ci/animation/
  campaign:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        case: [m1, m2, m3, m4, m5, m6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:campaign
        env:
          DEVICE: ${{ matrix.device }}
          CASE: ${{ matrix.case }}
          EVIDENCE_DIR: ../docs/evidence/ci/campaign-${{ matrix.device }}-${{ matrix.case }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-${{ matrix.device }}-${{ matrix.case }}-evidence
          path: docs/evidence/ci/campaign-${{ matrix.device }}-${{ matrix.case }}/
  deployment:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile, narrow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
        env:
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: docs/evidence/ci/deployment-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ matrix.device }}-evidence
          path: docs/evidence/ci/deployment-${{ matrix.device }}/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [verify, browser, immune, anatomy, clarity, animation, campaign, deployment]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
