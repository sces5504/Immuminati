name: Verify live GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify and publish to GitHub Pages]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-pages-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify published clarity controls on desktop and mobile
        run: npm run test:clarity
        env:
          TARGET_URL: https://sces5504.github.io/Immuminati/
          EVIDENCE_DIR: ../docs/evidence/live-clarity/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-clarity-evidence
          path: docs/evidence/live-clarity/
      - name: Play published tactical M1 on desktop and mobile
        run: npm run test:browser
        env:
          BASE_URL: https://sces5504.github.io/Immuminati/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-evidence
          path: docs/evidence/tactics/

  campaign:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile]
        case: [m1, m2, m3, m4, m5, m6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:campaign
        env:
          TARGET_URL: https://sces5504.github.io/Immuminati/
          DEVICE: ${{ matrix.device }}
          CASE: ${{ matrix.case }}
          EVIDENCE_DIR: ../docs/evidence/live-campaign-${{ matrix.device }}-${{ matrix.case }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-campaign-${{ matrix.device }}-${{ matrix.case }}-evidence
          path: docs/evidence/live-campaign-${{ matrix.device }}-${{ matrix.case }}/

  deployment:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [desktop, mobile, narrow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:deployment
        env:
          TARGET_URL: https://sces5504.github.io/Immuminati/
          DEVICE: ${{ matrix.device }}
          EVIDENCE_DIR: docs/evidence/live-deployment-${{ matrix.device }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-deployment-${{ matrix.device }}-evidence
          path: docs/evidence/live-deployment-${{ matrix.device }}/
