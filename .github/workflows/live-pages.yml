name: Verify live GitHub Pages
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Verify and publish to GitHub Pages]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: live-pages-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Play published tactical M1 on desktop and mobile
        run: npm run test:browser
        env:
          BASE_URL: https://sces5504.github.io/Immuminati/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-pages-evidence
          path: docs/evidence/tactics/
